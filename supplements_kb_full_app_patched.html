<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui;background:linear-gradient(180deg,#e6f0ff,#eef7ff);color:#0f172a;padding:12px}
  .container{max-width:1100px;margin:0 auto}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .title{font-weight:800;font-size:20px}
  .search-row{display:grid;grid-template-columns:1fr 220px;gap:8px;margin-bottom:12px}
  input,select{padding:10px;border-radius:10px;border:1px solid #cfe1ff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .card{background:white;border-radius:12px;padding:10px;box-shadow:0 6px 20px rgba(2,6,23,0.06);display:flex;flex-direction:column;min-height:140px}
  .meta{font-size:12px;color:#475569;margin-bottom:6px;display:flex;justify-content:space-between}
  .name{font-weight:700;font-size:15px;margin-bottom:6px}
  .notes{font-size:13px;color:#475569;margin-bottom:8px;max-height:3.6em;overflow:hidden}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#0f172a}
  .take{background:#ecfeff;color:#0369a1}
  .uses{background:#eef2ff;color:#6d28d9}
  .card-footer{display:flex;gap:8px;margin-top:auto}
  .btn{padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid rgba(15,23,42,0.06);background:white}
  .btn-primary{background:linear-gradient(90deg,#0ea5a8,#2563eb);color:white;border:none}
  .drawer-panel{position:fixed;right:0;top:0;height:100%;width:100%;max-width:520px;background:white;padding:18px;overflow:auto;transform:translateX(110%);transition:transform .28s ease;box-shadow:-30px 0 60px rgba(2,6,23,0.08);z-index:60}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.36);display:none;z-index:50}
  .drawer-open .drawer-backdrop{display:block}
  .drawer-open .drawer-panel{transform:translateX(0%)}
  .muted{color:#64748b;font-size:13px}
  a.ref-link{color:#0ea5a8;text-decoration:underline;font-size:13px}
  .badge{display:inline-block;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:600;margin-left:8px}
  .badge-nih{background:#e0f2fe;color:#0369a1}
  .badge-ncbi{background:#dcfce7;color:#166534}
  @media (max-width:640px){.search-row{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <div>
        <div class="title">Supplements Companion</div>
        <div class="muted">Search matches name, id, notes, uses, take_with, avoid_with, interactions. Reference badges show one trusted link per item.</div>
      </div>
      <div><button id="export" class="btn btn-primary">Export JSON</button></div>
    </div>

    <div class="search-row">
      <input id="searchInput" placeholder="Search supplements, e.g. 'vitamin d3', 'iron', 'curcumin'..." />
      <select id="category"><option value="All">All categories</option></select>
    </div>

    <div id="counts" class="muted" style="margin-bottom:8px"></div>
    <div id="grid" class="grid" role="list"></div>

    <div id="drawerWrapper" aria-hidden="true">
      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <div class="drawer-panel" id="drawerPanel">
        <button id="closeDrawer" class="btn" style="margin-bottom:12px;">Close</button>
        <div id="drawerContent"></div>
      </div>
    </div>

    <div style="margin-top:12px;font-size:12px;color:#64748b">Source KB: <code>supplements_kb_full.json</code>. If you'd like edits (colors, compactness, badges), tell me which tweaks.</div></div>

<script>
/* ===== REPAIR PATCH: robust search index + stable details drawer =====
   Replaced app script with this block.
*/
(function(){
  try {
    const KB = JSON.parse(document.getElementById('kb').textContent || '[]');
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('category');
    const counts = document.getElementById('counts');
    const exportBtn = document.getElementById('export');
    const drawerWrapper = document.getElementById('drawerWrapper');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const drawerContent = document.getElementById('drawerContent');

    // Build a normalized search index per item — avoids field type issues (arrays, objects, etc.)
    const INDEX = {}; // { id: "combined lowercase text" }
    KB.forEach(item => {
      const parts = [];
      if (item.name) parts.push(String(item.name));
      if (item.id) parts.push(String(item.id));
      // include many fields that users might search
      ['notes','uses','take_with','avoid_with','interactions','forms','typical_dosage','best_time','category'].forEach(f=>{
        if (item[f]) {
          if (Array.isArray(item[f])) parts.push(item[f].join(' '));
          else parts.push(String(item[f]));
        }
      });
      INDEX[item.id] = parts.join(' ').toLowerCase();
    });

    // populate categories dropdown (keeps your existing categories)
    const categories = Array.from(new Set(KB.map(i => i.category || 'Other'))).sort();
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    let query = '', catSel = 'All';

    function matches(item) {
      if (!query) return true;
      const text = INDEX[item.id] || '';
      return text.indexOf(query) !== -1;
    }

    function getBadgeHtml(url){
      if(!url) return '';
      if(url.includes('ods.od.nih.gov')) return '<span class="badge badge-nih">NIH ODS</span>';
      if(url.includes('ncbi.nlm.nih.gov')) return '<span class="badge badge-ncbi">NCBI</span>';
      return '<span class="badge">Source</span>';
    }

    function render(){
      // render cards from KB -> grid
      grid.innerHTML = '';
      const filtered = KB.filter(it => (catSel === 'All' || (it.category || 'Other') === catSel) && matches(it))
                         .sort((a,b)=> (String(a.name||'')).localeCompare(String(b.name||'')));
      counts.innerHTML = 'Showing <strong>' + filtered.length + '</strong> of ' + KB.length;
      const frag = document.createDocumentFragment();

      filtered.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = it.id;

        const notesPreview = (typeof it.notes === 'string') ? it.notes : (Array.isArray(it.notes) && it.notes.length ? it.notes[0] : '');
        const uses = (it.uses||[]).slice(0,3).join(', ');
        const take = (it.take_with||[]).slice(0,3).join('; ');

        card.innerHTML = ''
          + '<div class="meta"><div class="muted">' + (it.category || 'Other') + '</div><div class="muted">ID: ' + it.id + '</div></div>'
          + '<div class="name">' + (it.name || '') + '</div>'
          + '<div class="notes">' + (notesPreview || '') + '</div>'
          + '<div class="chips"><div class="chip uses">Uses: ' + (uses || '—') + '</div><div class="chip take">Take: ' + (take || '—') + '</div></div>'
          + '<div class="card-footer"><button class="btn btn-primary detailBtn" data-id="' + it.id + '">Details</button><button class="btn btn-copy copyBtn" data-id="' + it.id + '">Copy</button></div>';

        frag.appendChild(card);
      });

      grid.appendChild(frag);
    }

    // stable event delegation for buttons inside grid
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      if (!id) return;
      if (btn.classList.contains('detailBtn')) openDrawer(id);
      if (btn.classList.contains('copyBtn')) {
        const it = KB.find(x => x.id === id);
        if (it && navigator.clipboard) {
          try { navigator.clipboard.writeText(JSON.stringify(it, null, 2)); } catch(e) { /* ignore */ }
        }
        alert('Copied JSON to clipboard for ' + id);
      }
    });

    // open drawer: reliably pick a clickable reference (first references[0] OR first http-like note)
    function openDrawer(id) {
      const it = KB.find(x => x.id === id);
      if (!it) return;
      let ref = '';
      if (it.references && it.references.length) ref = it.references[0];
      else if (it.notes) {
        if (typeof it.notes === 'string' && it.notes.startsWith('http')) ref = it.notes;
        else if (Array.isArray(it.notes)) {
          const maybe = it.notes.find(n => typeof n === 'string' && n.startsWith('http'));
          if (maybe) ref = maybe;
        }
      }
      const badge = getBadgeHtml(ref);
      const refHtml = ref ? ('<a class="ref-link" href="' + ref + '" target="_blank" rel="noreferrer">' + ref + '</a> ' + badge) : '—';

      drawerContent.innerHTML = ''
        + '<h2 style="font-size:18px;margin:0 0 8px;font-weight:800">' + (it.name || '') + '</h2>'
        + '<div class="muted" style="margin-bottom:8px">' + (it.category || 'Other') + ' • ID: ' + it.id + '</div>'
        + '<div style="margin-bottom:8px"><strong>Forms:</strong> ' + ((it.forms && it.forms.length)? it.forms.join(', ') : '—') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Typical dosage:</strong> ' + (it.typical_dosage || '—') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Best time:</strong> ' + (it.best_time || '—') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Uses:</strong><ul>' + ((it.uses||[]).map(u=>'<li>'+u+'</li>').join('')) + '</ul></div>'
        + '<div style="margin-bottom:8px"><strong>Take with:</strong>' + ((it.take_with && it.take_with.length)? '<ul>' + it.take_with.map(u=>'<li>'+u+'</li>').join('') + '</ul>' : ' —') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Avoid:</strong>' + ((it.avoid_with && it.avoid_with.length)? '<ul>' + it.avoid_with.map(u=>'<li>'+u+'</li>').join('') + '</ul>' : ' —') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Interactions / Cautions:</strong>' + ((it.interactions && it.interactions.length)? '<ul>' + it.interactions.map(u=>'<li>'+u+'</li>').join('') + '</ul>' : ' —') + '</div>'
        + '<div style="margin-bottom:8px"><strong>Notes:</strong><div class="muted" style="margin-top:6px">' + (typeof it.notes==='string'?it.notes:(Array.isArray(it.notes)?it.notes.join('<br>'):'—')) + '</div></div>'
        + '<div style="margin-bottom:8px"><strong>Reference:</strong><div style="margin-top:6px">' + refHtml + '</div></div>'
        + '<div style="display:flex;gap:8px;margin-top:12px"><button id="exportItem" class="btn btn-primary">Export item</button><button id="closeBtn" class="btn">Close</button></div>';

      document.body.classList.add('drawer-open');
      drawerWrapper.style.display = 'block';

      // wire the close/export local buttons freshly each open
      const closeBtn = document.getElementById('closeBtn');
      if (closeBtn) {
        closeBtn.onclick = () => { document.body.classList.remove('drawer-open'); drawerWrapper.style.display='none'; };
      }
      const exportItem = document.getElementById('exportItem');
      if (exportItem) {
        exportItem.onclick = () => {
          const dataStr = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(it, null, 2));
          const dl = document.createElement('a'); dl.setAttribute('href', dataStr); dl.setAttribute('download', it.id + '.json'); document.body.appendChild(dl); dl.click(); dl.remove();
        };
      }
    }

    // close handlers (drawer backdrop + top Close)
    function closeDrawerHandler(){ document.body.classList.remove('drawer-open'); drawerWrapper.style.display='none'; }
    drawerBackdrop.addEventListener('click', closeDrawerHandler);
    const topClose = document.getElementById('closeDrawer');
    if (topClose) topClose.addEventListener('click', closeDrawerHandler);

    // search input (debounced) — stores lowercase query
    let debounceTimer = null;
    searchInput.addEventListener('input', (e)=> {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=> {
        query = (e.target.value || '').trim().toLowerCase();
        render();
      }, 100);
    });

    // category filter
    categorySelect.addEventListener('change', (e)=>{ catSel = e.target.value; render(); });

    // export all
    if (exportBtn) {
      exportBtn.addEventListener('click', ()=> {
        const dataStr = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(KB, null, 2));
        const dl = document.createElement('a'); dl.setAttribute('href', dataStr); dl.setAttribute('download', 'supplements_kb_full.json'); document.body.appendChild(dl); dl.click(); dl.remove();
      });
    }

    // initial render
    render();

    // helpful quick console message
    console.log('Repaired supplements app: search and details wired (items:', KB.length, ')');
  } catch (err) {
    console.error('App repair script error:', err);
    alert('Error initializing app repair script — see console for details.');
  }
})();
</script>
